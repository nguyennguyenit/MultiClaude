<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Reconciliation Test - Moving Elements Between Parents</title>
  <script crossorigin src="https://unpkg.com/react@19/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .container {
      margin: 20px 0;
      padding: 20px;
      border: 2px solid #569cd6;
      border-radius: 8px;
    }
    .hidden {
      display: none;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #569cd6;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #4a8cc1;
    }
    .log {
      margin-top: 20px;
      padding: 15px;
      background: #252526;
      border-left: 4px solid #4ec9b0;
      font-size: 14px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
    }
    .log-entry {
      margin: 5px 0;
    }
    .mount { color: #4ec9b0; }
    .unmount { color: #f48771; }
    .update { color: #dcdcaa; }
    h1 { color: #569cd6; }
    h2 { color: #4ec9b0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, memo } = React;

    // Component that tracks its lifecycle
    const TrackedComponent = memo(function TrackedComponent({ id, name, onLog }) {
      const mountCountRef = useRef(0);
      const renderCountRef = useRef(0);

      // Track mounts
      useEffect(() => {
        mountCountRef.current++;
        onLog(`🟢 MOUNT: ${name} (mount #${mountCountRef.current})`, 'mount');

        return () => {
          onLog(`🔴 UNMOUNT: ${name} (was mounted ${mountCountRef.current} times)`, 'unmount');
        };
      }, []); // Empty deps = runs on mount/unmount only

      // Track renders
      renderCountRef.current++;

      useEffect(() => {
        if (renderCountRef.current > 1) {
          onLog(`🟡 UPDATE: ${name} (render #${renderCountRef.current})`, 'update');
        }
      });

      return (
        <div style={{
          padding: '15px',
          margin: '10px 0',
          background: '#2d2d30',
          border: '1px solid #3e3e42',
          borderRadius: '4px'
        }}>
          <strong>{name}</strong>
          <div style={{ fontSize: '12px', marginTop: '5px', opacity: 0.7 }}>
            Key: {id} | Renders: {renderCountRef.current} | Mounts: {mountCountRef.current}
          </div>
        </div>
      );
    });

    function App() {
      const [showInHidden, setShowInHidden] = useState(true);
      const [logs, setLogs] = useState([]);

      const addLog = (message, type) => {
        setLogs(prev => [...prev, { message, type, timestamp: Date.now() }]);
      };

      const togglePosition = () => {
        setShowInHidden(prev => !prev);
      };

      const clearLogs = () => {
        setLogs([]);
      };

      return (
        <div>
          <h1>React 19 Reconciliation Test</h1>
          <h2>Question: Does React unmount/remount when a keyed element moves between different parent containers?</h2>

          <button onClick={togglePosition}>
            Move Component Between Parents
          </button>
          <button onClick={clearLogs}>Clear Logs</button>

          <div style={{ marginTop: '20px', fontSize: '14px' }}>
            <strong>Current state:</strong> Component is in <span style={{ color: '#4ec9b0' }}>
              {showInHidden ? 'HIDDEN Container' : 'VISIBLE Container'}
            </span>
          </div>

          {/* Hidden container - simulates display: none */}
          <div className="container hidden">
            <h3>Hidden Container (display: none)</h3>
            {showInHidden && (
              <TrackedComponent
                key="tracked-item"
                id="tracked-item"
                name="TrackedComponent"
                onLog={addLog}
              />
            )}
          </div>

          {/* Visible container - simulates visible grid */}
          <div className="container">
            <h3>Visible Container</h3>
            {!showInHidden && (
              <TrackedComponent
                key="tracked-item"
                id="tracked-item"
                name="TrackedComponent"
                onLog={addLog}
              />
            )}
          </div>

          {/* Logs */}
          <div className="log">
            <h3>Lifecycle Logs:</h3>
            {logs.length === 0 ? (
              <div style={{ opacity: 0.5 }}>Click "Move Component" to see lifecycle events...</div>
            ) : (
              logs.map((log, i) => (
                <div key={i} className={`log-entry ${log.type}`}>
                  {log.message}
                </div>
              ))
            )}
          </div>

          <div style={{ marginTop: '20px', padding: '15px', background: '#264f78', borderRadius: '4px' }}>
            <strong>Expected Behavior (React Reconciliation Rules):</strong>
            <ul style={{ marginTop: '10px' }}>
              <li>If component with same <code>key</code> moves to a <strong>different parent element</strong> in the React tree, React will:
                <ol style={{ marginLeft: '20px', marginTop: '5px' }}>
                  <li>🔴 UNMOUNT from old parent (destroying component instance)</li>
                  <li>🟢 MOUNT in new parent (creating fresh component instance)</li>
                </ol>
              </li>
              <li>This happens even if the <code>key</code> is identical!</li>
              <li>Keys only prevent reconciliation <strong>within the same parent container</strong></li>
            </ul>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
