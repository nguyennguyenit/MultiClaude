name: UI Tests

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies for Electron
        run: npx playwright install-deps

      - name: Build app for testing
        run: npm run build:unpack

      - name: Run UI tests with Xvfb
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:ui

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            src/__tests__/e2e/test-results
            src/__tests__/e2e/test-artifacts
          retention-days: 7

      - name: Upload screenshot diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-diffs
          path: src/__tests__/e2e/test-artifacts/**/*-diff.png
          retention-days: 7
