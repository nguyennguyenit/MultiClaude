name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload (e.g. v3.1.0-beta.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate macOS release credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            joined="$(IFS=', '; echo "${missing[*]}")"
            echo "::error::Missing required macOS release credentials: $joined"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify types, lint, and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:benchmarks
          npm run test:release

      - name: Build with manifests (Linux/Windows)
        if: runner.os != 'macOS'
        run: npm run build:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build, sign, and notarize (macOS)
        if: runner.os == 'macOS'
        run: npm run build:release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify cross-process terminal stream (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui -- --grep "Terminal Stream Correctness"

      - name: Verify cross-process terminal stream (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:ui -- --grep "Terminal Stream Correctness"

      - name: Verify packaged application starts (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package-smoke

      - name: Verify packaged application starts (Windows)
        if: runner.os == 'Windows'
        run: npm run test:package-smoke

      - name: Verify mounted DMG application starts (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG_PATH="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then echo "DMG artifact not found"; exit 1; fi
          MOUNT_POINT="$(mktemp -d)"
          cleanup() { hdiutil detach "$MOUNT_POINT" || true; rmdir "$MOUNT_POINT" || true; }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG_PATH"
          npm run test:package-smoke -- --executable="$MOUNT_POINT/MultiClaude.app/Contents/MacOS/MultiClaude"

      - name: Verify AppImage artifact starts (Linux)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_PATH="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE_PATH" ]; then echo "AppImage artifact not found"; exit 1; fi
          chmod +x "$APPIMAGE_PATH"
          set +e
          timeout 15s xvfb-run -a "$APPIMAGE_PATH" --appimage-extract-and-run --no-sandbox
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then echo "AppImage exited before smoke window (status $STATUS)"; exit "$STATUS"; fi

      - name: Verify portable EXE artifact starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter '*Portable*.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Portable EXE artifact not found' }
          $before = @(Get-Process MultiClaude -ErrorAction SilentlyContinue | ForEach-Object Id)
          $launcher = Start-Process $portable.FullName -PassThru
          Start-Sleep -Seconds 12
          $started = @(Get-Process MultiClaude -ErrorAction SilentlyContinue | Where-Object { $before -notcontains $_.Id })
          if ($started.Count -eq 0) { throw 'Portable EXE did not start MultiClaude' }
          $started | Stop-Process -Force
          if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force }

      - name: Verify Developer ID signature and notarization
        if: runner.os == 'macOS'
        run: |
          APP_PATH=""
          for candidate in release/mac-arm64/MultiClaude.app release/mac/MultiClaude.app release/mac-universal/MultiClaude.app; do
            if [ -d "$candidate" ]; then APP_PATH="$candidate"; break; fi
          done
          if [ -z "$APP_PATH" ]; then echo "Packaged macOS app not found"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --verbose --type exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.exe
            release/*.exe.blockmap
            release/latest*.yml
          if-no-files-found: ignore

  upload:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "Missing required release tag input."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid tag format: $TAG (expected vX.Y.Z or vX.Y.Z-beta.N)"
            exit 1
          fi
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Expected draft release $TAG to exist before uploading assets."
            exit 1
          fi
          echo "Uploading artifacts to release $TAG..."
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done
          echo "Upload complete!"
